[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apqr-toolkit"
version = "0.1.0"
description = "Open-source statistics for pharmaceutical Annual Product Quality Reviews (APQR/PQR): capability, control charts and trend rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mostafa" }]
keywords = ["pharma", "APQR", "PQR", "GMP", "quality", "SPC", "Cpk", "control chart", "trending"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apqr = "apqr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
